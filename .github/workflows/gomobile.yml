name: Go Mobile AAR

on:
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "mobile/**"
      - "internal/**"
      - ".github/workflows/gomobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bind:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.16248370"
      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
      - name: Initialize gomobile
        run: gomobile init
      - name: Bind Go core
        run: mkdir -p app/libs && gomobile bind -target=android -androidapi=21 -javapkg=dev.go.core -o app/libs/go-core.aar ./mobile
      - uses: actions/upload-artifact@v4
        with:
          name: go-core-aar
          path: app/libs/go-core.aar
          if-no-files-found: error
